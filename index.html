<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات الإلكترونية المتقدمة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #f5f0e8 0%, #faf7f2 100%);
            min-height: 100vh;
        }

        .exam-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(139, 69, 19, 0.15);
            border: 3px solid #d4a574;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(139, 69, 19, 0.4); }

        .btn-secondary {
            background: #e5e7eb;
            transition: all 0.3s;
        }
        .btn-secondary:hover:not(:disabled) { background: #d1d5db; transform: translateY(-2px); }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

        .option-btn {
            border: 3px solid #e5e7eb;
            transition: all 0.2s;
        }
        .option-btn:hover { border-color: #8B4513; background: #fff8f0; }
        .option-btn.selected { border-color: #10b981; background: #d1fae5; }

        .matching-item {
            border: 3px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.2s;
        }
        .matching-item:hover { border-color: #8B4513; background: #fff8f0; }        .matching-item.selected { border-color: #f59e0b; background: #fef3c7; }
        .matching-item.matched { border-color: #10b981; background: #d1fae5; pointer-events: none; }

        .upload-zone {
            border: 3px dashed #d4a574;
            background: #fff8f0;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-zone:hover { border-color: #8B4513; background: #fef3c7; transform: scale(1.02); }

        .image-preview {
            border: 3px solid #10b981;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .image-preview img { width: 100%; max-height: 400px; object-fit: contain; }

        .progress-bar {
            background: linear-gradient(90deg, #8B4513, #d4a574);
            transition: width 0.5s ease;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 1rem 0;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .image-item {
            text-align: center;
            padding: 0.75rem;
            background: #f9fafb;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }
        .image-item img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }        .image-item input {
            width: 100%;
            padding: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .image-item input:focus {
            outline: none;
            border-color: #8B4513;
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 640px) {
            .exam-card { border-radius: 12px; padding: 1rem; }
        }
    </style>
</head>
<body class="p-4">

    <!-- زر اللغة -->
    <button onclick="toggleLang()" class="fixed top-4 left-4 bg-white border-2 border-amber-700 text-amber-700 px-4 py-2 rounded-full font-bold hover:bg-amber-50 transition-all z-50">
        <i class="fas fa-globe ml-2"></i>
        <span id="lang-btn">English</span>
    </button>

    <!-- الشاشة الرئيسية -->
    <div id="main-screen" class="max-w-4xl mx-auto mt-8 exam-card p-8 fade-in">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-amber-900 mb-4">منصة الاختبارات الإلكترونية</h1>
            <p class="text-xl text-gray-600">اختر المادة لبدء الاختبار</p>
        </div>

        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <button onclick="startExam('english')" class="p-6 bg-gradient-to-br from-red-50 to-pink-50 rounded-2xl border-2 border-red-200 hover:border-red-400 transition-all hover:scale-105">
                <i class="fas fa-language text-5xl text-red-600 mb-3"></i>
                <h3 class="text-2xl font-bold text-gray-800">اللغة الإنجليزية</h3>
            </button>
            <button onclick="startExam('arabic')" class="p-6 bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl border-2 border-green-200 hover:border-green-400 transition-all hover:scale-105">
                <i class="fas fa-book-arabic text-5xl text-green-600 mb-3"></i>
                <h3 class="text-2xl font-bold text-gray-800">اللغة العربية</h3>
            </button>
            <button onclick="startExam('math')" class="p-6 bg-gradient-to-br from-purple-50 to-indigo-50 rounded-2xl border-2 border-purple-200 hover:border-purple-400 transition-all hover:scale-105">                <i class="fas fa-calculator text-5xl text-purple-600 mb-3"></i>
                <h3 class="text-2xl font-bold text-gray-800">الرياضيات</h3>
            </button>
        </div>
    </div>

    <!-- شاشة الاختبار -->
    <div id="exam-screen" class="max-w-4xl mx-auto mt-8 exam-card p-6 fade-in hidden">
        <!-- الهيدر -->
        <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-4 rounded-xl border-2 border-amber-300 mb-6">
            <div class="flex justify-between items-center flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-gradient-to-br from-amber-500 to-orange-600 rounded-full flex items-center justify-center text-white text-2xl shadow-lg">
                        <i class="fas fa-pen-fancy"></i>
                    </div>
                    <div>
                        <h2 id="subject-title" class="text-2xl font-bold text-amber-900"></h2>
                        <p class="text-gray-600">
                            السؤال <span id="q-current" class="font-bold text-amber-700">1</span> 
                            من <span id="q-total" class="font-bold text-amber-700">5</span>
                        </p>
                    </div>
                </div>
                <button onclick="exitExam()" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-lg font-bold transition-all">
                    <i class="fas fa-times ml-2"></i>خروج
                </button>
            </div>
        </div>

        <!-- شريط التقدم -->
        <div class="w-full bg-gray-200 rounded-full h-4 mb-6 overflow-hidden">
            <div id="progress" class="progress-bar h-4 rounded-full" style="width: 20%"></div>
        </div>

        <!-- منطقة السؤال -->
        <div id="question-area" class="mb-6">
            <!-- هنا رح تظهر الأسئلة -->
        </div>

        <!-- أزرار التنقل -->
        <div class="flex justify-between gap-4 pt-6 border-t-2 border-gray-200">
            <button onclick="prevQuestion()" id="btn-prev" class="btn-secondary px-8 py-3 rounded-xl font-bold text-lg disabled:opacity-40">
                <i class="fas fa-arrow-right ml-2"></i>السابق
            </button>
            <button onclick="nextQuestion()" id="btn-next" class="btn-primary text-white px-8 py-3 rounded-xl font-bold text-lg">
                التالي<i class="fas fa-arrow-left mr-2"></i>
            </button>
            <button onclick="finishExam()" id="btn-finish" class="hidden bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl font-bold text-lg">
                إنهاء الاختبار<i class="fas fa-check-circle mr-2"></i>
            </button>        </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="max-w-2xl mx-auto mt-8 exam-card p-8 text-center fade-in hidden">
        <div class="w-32 h-32 bg-gradient-to-br from-green-400 to-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl">
            <i class="fas fa-trophy text-6xl text-white"></i>
        </div>
        <h2 class="text-4xl font-black text-gray-800 mb-4">أحسنت يا بطل! 🎉</h2>
        <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-2xl p-8 mb-6 border-2 border-amber-300">
            <p class="text-xl text-gray-700 mb-3">نتيجتك النهائية</p>
            <div class="text-6xl font-black text-amber-700 mb-2">
                <span id="final-score">0</span>
                <span class="text-3xl text-gray-500">من <span id="total-score">30</span></span>
            </div>
            <div id="percentage" class="text-2xl font-bold text-green-600"></div>
        </div>
        <button onclick="location.reload()" class="btn-primary text-white px-8 py-4 rounded-xl text-xl font-bold">
            اختبار جديد<i class="fas fa-redo ml-2"></i>
        </button>
    </div>

    <script>
        // === البيانات ===
        const images = {
            airplane: 'https://cdn-icons-png.flaticon.com/512/199/199861.png',
            monkey: 'https://cdn-icons-png.flaticon.com/512/616/616408.png',
            tree: 'https://cdn-icons-png.flaticon.com/512/616/616567.png',
            rabbit: 'https://cdn-icons-png.flaticon.com/512/616/616430.png',
            stars: 'https://cdn-icons-png.flaticon.com/512/3050/3050173.png',
            banana: 'https://cdn-icons-png.flaticon.com/512/2909/2909732.png',
            flower: 'https://cdn-icons-png.flaticon.com/512/888/888847.png',
            horse: 'https://cdn-icons-png.flaticon.com/512/616/616490.png',
            grapes: 'https://cdn-icons-png.flaticon.com/512/4391/4391690.png',
            duck: 'https://cdn-icons-png.flaticon.com/512/616/616562.png'
        };

        let currentLang = 'ar';
        let currentSubject = '';
        let currentQIndex = 0;
        let questions = [];
        let answers = {};

        const translations = {
            ar: {
                english: 'اللغة الإنجليزية',
                arabic: 'اللغة العربية',
                math: 'الرياضيات',
                question: 'السؤال',
                of: 'من',                exit: 'خروج',
                previous: 'السابق',
                next: 'التالي',
                finish: 'إنهاء الاختبار',
                wellDone: 'أحسنت يا بطل! 🎉',
                yourScore: 'نتيجتك النهائية',
                from: 'من',
                newExam: 'اختبار جديد',
                uploadImage: 'اضغط هنا لرفع صورة الحل',
                dragDrop: 'أو اسحب الصورة وأفلتها هنا',
                supportedFormats: 'يدعم: JPG, PNG, PDF',
                writeAnswer: 'اكتب إجابتك في ورقة ثم صورها وارفعها',
                instructions: 'تعليمات:',
                completeLetters: 'أكمل الحروف الناقصة',
                matchLetters: 'وصّل الحرف الكبير بالحرف الصغير',
                firstLetter: 'اكتب الحرف الأول من كل صورة'
            },
            en: {
                english: 'English Language',
                arabic: 'Arabic Language',
                math: 'Mathematics',
                question: 'Question',
                of: 'of',
                exit: 'Exit',
                previous: 'Previous',
                next: 'Next',
                finish: 'Finish Exam',
                wellDone: 'Well Done! 🎉',
                yourScore: 'Your Final Score',
                from: 'from',
                newExam: 'New Exam',
                uploadImage: 'Click to upload your answer',
                dragDrop: 'or drag and drop image here',
                supportedFormats: 'Supports: JPG, PNG, PDF',
                writeAnswer: 'Write your answer on paper, then photograph and upload',
                instructions: 'Instructions:',
                completeLetters: 'Complete the missing letters',
                matchLetters: 'Match capital with small letters',
                firstLetter: 'Write the first letter of each picture'
            }
        };

        // === بنك الأسئلة ===
        const questionBank = {
            english: [
                {
                    type: 'upload',
                    question: { ar: 'أكمل الحروف الناقصة: e, _, _, _, i, _, _, _, _', en: 'Complete: e, _, _, _, i, _, _, _, _' },
                    instruction: { ar: 'اكتب: f, g, h, j, k, l, m', en: 'Write: f, g, h, j, k, l, m' },
                    marks: 10                },
                {
                    type: 'image_answer',
                    question: { ar: 'اكتب الحرف الأول من كل صورة:', en: 'Write first letter:' },
                    images: [images.airplane, images.monkey, images.tree, images.rabbit, images.stars],
                    answers: ['A', 'M', 'T', 'R', 'S'],
                    marks: 10
                },
                {
                    type: 'matching',
                    question: { ar: 'وصّل الحرف الكبير بالحرف الصغير:', en: 'Match capitals with small:' },
                    left: ['M', 'Q', 'K', 'D', 'R'],
                    right: ['m', 'q', 'k', 'd', 'r'],
                    correct: { 0: 0, 1: 1, 2: 2, 3: 3, 4: 4 },
                    marks: 10
                }
            ],
            arabic: [
                {
                    type: 'upload',
                    question: { ar: 'اكتب الحروف الناقصة في الجدول', en: 'Write missing letters' },
                    instruction: { ar: 'أكمل الحروف العربية', en: 'Complete Arabic letters' },
                    marks: 10
                },
                {
                    type: 'image_answer',
                    question: { ar: 'اكتب الحرف الأول من كل صورة:', en: 'Write first letter:' },
                    images: [images.banana, images.flower, images.horse, images.grapes, images.duck],
                    answers: ['م', 'ز', 'ح', 'ع', 'ب'],
                    marks: 10
                },
                {
                    type: 'mcq',
                    question: { ar: 'اختر الحرف المشابه لـ "م":', en: 'Choose similar to "م":' },
                    options: ['ن', 'م', 'هـ', 'ي'],
                    correct: 1,
                    marks: 10
                }
            ],
            math: [
                {
                    type: 'upload',
                    question: { ar: 'أكمل الأعداد الناقصة: 1-15', en: 'Complete numbers 1-15' },
                    instruction: { ar: 'اكتب الأعداد الناقصة', en: 'Write missing numbers' },
                    marks: 15
                },
                {
                    type: 'mcq',
                    question: { ar: 'كم تفاحة؟ 🍎', en: 'How many apples? 🍎🍎' },
                    options: ['1', '2', '3', '4'],                    correct: 1,
                    marks: 5
                },
                {
                    type: 'mcq',
                    question: { ar: 'كم برطمان؟ 🫙', en: 'How many jars? 🫙🫙' },
                    options: ['1', '2', '3', '4'],
                    correct: 1,
                    marks: 5
                },
                {
                    type: 'mcq',
                    question: { ar: 'كم قطرة؟ 💧💧💧', en: 'How many drops? 💧💧' },
                    options: ['2', '3', '4', '5'],
                    correct: 1,
                    marks: 5
                }
            ]
        };

        // === الدوال الأساسية ===
        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('lang-btn').textContent = currentLang === 'ar' ? 'English' : 'العربية';
        }

        function startExam(subject) {
            currentSubject = subject;
            currentQIndex = 0;
            answers = {};

            // اختيار نموذج عشوائي وخلط الأسئلة
            const bank = questionBank[subject];
            questions = [...bank].sort(() => Math.random() - 0.5);

            // خلط خيارات MCQ
            questions = questions.map(q => {
                if (q.type === 'mcq') {
                    const indexed = q.options.map((opt, idx) => ({ opt, isCorrect: idx === q.correct }));
                    const shuffled = indexed.sort(() => Math.random() - 0.5);
                    return {
                        ...q,
                        options: shuffled.map(x => x.opt),
                        correct: shuffled.findIndex(x => x.isCorrect)
                    };
                }
                return q;
            });
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            
            document.getElementById('subject-title').textContent = translations[currentLang][subject];
            document.getElementById('q-total').textContent = questions.length;

            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQIndex];
            const area = document.getElementById('question-area');
            
            // تحديث الأرقام والشريط
            document.getElementById('q-current').textContent = currentQIndex + 1;
            const progress = ((currentQIndex + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';

            // إنشاء HTML السؤال
            let html = `
                <div class="bg-white rounded-xl p-6 border-2 border-gray-200">
                    <h3 class="text-2xl font-bold text-gray-800 mb-4">${q.question[currentLang]}</h3>
            `;

            if (q.type === 'upload') {
                html += `
                    <div class="bg-amber-50 border-2 border-amber-300 rounded-lg p-4 mb-4">
                        <p class="text-amber-900 font-bold mb-2">
                            <i class="fas fa-info-circle ml-2"></i>
                            ${translations[currentLang].instructions}
                        </p>
                        <p class="text-amber-800">${q.instruction[currentLang]}</p>
                    </div>
                    <div class="upload-zone rounded-xl p-8 text-center" onclick="document.getElementById('file-input').click()">
                        <i class="fas fa-cloud-upload-alt text-6xl text-amber-600 mb-4"></i>
                        <p class="text-gray-800 font-bold text-lg mb-2">${translations[currentLang].uploadImage}</p>
                        <p class="text-gray-500">${translations[currentLang].dragDrop}</p>
                        <p class="text-gray-400 text-sm mt-2">${translations[currentLang].supportedFormats}</p>
                    </div>
                    <input type="file" id="file-input" accept="image/*,.pdf" class="hidden" onchange="handleFile(this)">
                    <div id="preview-container"></div>
                </div>
            `;
            } else if (q.type === 'mcq') {
                html += `<div class="space-y-3">`;
                q.options.forEach((opt, idx) => {
                    const selected = answers[currentQIndex] === idx ? 'selected' : '';
                    html += `                        <button onclick="selectMCQ(${idx})" class="option-btn w-full text-right p-5 rounded-xl font-bold text-lg flex items-center gap-3 ${selected}">
                            <span class="w-12 h-12 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center font-black">${String.fromCharCode(65 + idx)}</span>
                            <span>${opt}</span>
                        </button>
                    `;
                });
                html += `</div></div>`;
            } else if (q.type === 'matching') {
                html += `
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-3">
                            ${q.left.map((item, idx) => `
                                <button onclick="selectMatch('left', ${idx})" 
                                    class="matching-item w-full p-4 rounded-xl font-bold text-lg text-center bg-white"
                                    id="left-${idx}"
                                    data-side="left" data-idx="${idx}">
                                    ${item}
                                </button>
                            `).join('')}
                        </div>
                        <div class="space-y-3">
                            ${q.right.map((item, idx) => `
                                <button onclick="selectMatch('right', ${idx})" 
                                    class="matching-item w-full p-4 rounded-xl font-bold text-lg text-center bg-white"
                                    id="right-${idx}"
                                    data-side="right" data-idx="${idx}">
                                    ${item}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
            } else if (q.type === 'image_answer') {
                html += `<div class="image-grid">`;
                q.images.forEach((img, idx) => {
                    const val = answers[currentQIndex]?.images?.[idx] || '';
                    html += `
                        <div class="image-item">
                            <img src="${img}" alt="img${idx}">
                            <input type="text" maxlength="1" 
                                value="${val}"
                                onchange="saveImageAnswer(${idx}, this.value)"
                                placeholder="?"
                                id="img-input-${idx}">
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            area.innerHTML = html;

            // تحديث الأزرار
            document.getElementById('btn-prev').disabled = currentQIndex === 0;
            if (currentQIndex === questions.length - 1) {
                document.getElementById('btn-next').classList.add('hidden');
                document.getElementById('btn-finish').classList.remove('hidden');
            } else {
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-finish').classList.add('hidden');
            }

            // استعادة الإجابة إذا موجودة
            if (answers[currentQIndex]) {
                if (answers[currentQIndex].image) {
                    showPreview(answers[currentQIndex].image);
                }
            }
        }

        function selectMCQ(idx) {
            answers[currentQIndex] = idx;
            renderQuestion();
        }

        let matchTemp = { left: null, right: null };

        function selectMatch(side, idx) {
            matchTemp[side] = idx;
            
            // إزالة التحديد السابق
            document.querySelectorAll(`[data-side="${side}"]`).forEach(el => el.classList.remove('selected'));
            document.getElementById(`${side}-${idx}`).classList.add('selected');

            if (matchTemp.left !== null && matchTemp.right !== null) {
                // حفظ التطابق
                if (!answers[currentQIndex]) answers[currentQIndex] = { matches: {} };
                answers[currentQIndex].matches[matchTemp.left] = matchTemp.right;

                // تمييز العناصر المتطابقة
                document.getElementById(`left-${matchTemp.left}`).classList.add('matched');
                document.getElementById(`right-${matchTemp.right}`).classList.add('matched');

                matchTemp = { left: null, right: null };
            }
        }

        function saveImageAnswer(idx, value) {
            if (!answers[currentQIndex]) answers[currentQIndex] = { images: {} };
            answers[currentQIndex].images[idx] = value.toUpperCase();        }

        function handleFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    answers[currentQIndex] = { image: e.target.result };
                    showPreview(e.target.result);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function showPreview(src) {
            const container = document.getElementById('preview-container');
            container.innerHTML = `
                <div class="image-preview">
                    <img src="${src}" alt="preview">
                    <div class="absolute top-2 right-2 bg-green-500 text-white w-10 h-10 rounded-full flex items-center justify-center">
                        <i class="fas fa-check"></i>
                    </div>
                </div>
            `;
        }

        function nextQuestion() {
            if (currentQIndex < questions.length - 1) {
                currentQIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                renderQuestion();
            }
        }

        function finishExam() {
            let score = 0;
            questions.forEach((q, idx) => {
                if (q.type === 'mcq') {
                    if (answers[idx] === q.correct) score += q.marks;
                } else if (q.type === 'matching') {
                    if (answers[idx]?.matches) {
                        let correct = 0;
                        Object.entries(q.correct).forEach(([l, r]) => {
                            if (answers[idx].matches[l] == r) correct++;
                        });                        score += (correct / Object.keys(q.correct).length) * q.marks;
                    }
                } else if (q.type === 'image_answer') {
                    if (answers[idx]?.images) {
                        let correct = 0;
                        q.answers.forEach((ans, i) => {
                            if (answers[idx].images[i] === ans) correct++;
                        });
                        score += (correct / q.answers.length) * q.marks;
                    }
                } else if (q.type === 'upload') {
                    if (answers[idx]?.image) score += q.marks;
                }
            });

            document.getElementById('exam-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = Math.round(score);
            document.getElementById('total-score').textContent = questions.reduce((sum, q) => sum + q.marks, 0);
            
            const pct = Math.round((score / questions.reduce((sum, q) => sum + q.marks, 0)) * 100);
            document.getElementById('percentage').textContent = `${pct}%`;
        }

        function exitExam() {
            if (confirm('هل تريد الخروج من الاختبار؟')) {
                location.reload();
            }
        }
    </script>
</body>
